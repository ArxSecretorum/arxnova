[project]
name = "arxnova"
version = "0.2.17"
description = "Arx Nova — сервер домашней FLAC-медиатеки для Arx Player: слушать свою музыку из любой точки, поток по вкусу"
authors = [
    { name = "Arx Secretorum", email = "298407241+ArxSecretorum@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pillow>=11.0",  # уменьшенные обложки: список альбомов по мобильной сети — 20 МБ → ~1,5 МБ
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",  # события файловой системы: медиатека разбирается, только когда в папке что-то изменилось
    "zeroconf>=0.151.5",
]

[project.optional-dependencies]
# Фасеты звука (ФТ-2.3, ФТ-2.4): стемы Demucs и темп Beat This! — только на настольной машине
# (ОП-5); на Pi и в установщике сервера их нет, туда приходят готовые векторы и признаки.
stems = [
    "demucs>=4.1.0",
    "beat-this>=1.1.0",
    "safetensors>=0.4",  # веса Beat This! с зеркала (facets.ensure_beats)
    "onnx>=1.17",  # MAEST на GPU: модель ONNX переводится в PyTorch (maest.py)
    "onnx2torch>=1.5",
    "torch>=2.4",
    "umap-learn>=0.5.12",  # карта медиатеки для панели шлюза (КО-5)
]

[project.scripts]
arxnova = "arxnova:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "torch>=2.14.1",
    "transformers>=5.20.2",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Mac на Intel не поддерживаем (у onnxruntime нет колёс), а Demucs там требует старый numpy
environments = ["sys_platform != 'darwin' or platform_machine == 'arm64'"]
